# 车辆数据文档处理器配置

document:
  # 跳过全部一致性验证；数据提取和字段验证仍会执行。
  skip_verification: false
  # 不从文档正文或合计行搜索声明记录数。
  skip_count_check: false
  large_file_threshold: 100
  max_paragraphs_to_search: 30
  max_tables_to_search: 5

performance:
  # 表格数据的逻辑处理块大小，必须大于 0。
  chunk_size: 1000
  # auto: 文件达到阈值后使用低内存 OOXML 流式解析；也可设 true/false 强制切换。
  streaming_xml: auto
  streaming_threshold_mb: 1

output:
  # false 时使用传统表格输出；文件输出当前固定为 CSV。
  use_dashboard: true
