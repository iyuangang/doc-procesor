[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-processor"
version = "1.0.0"
description = "处理车辆数据文档的工具"
authors = [
    {name = "iyuangang", email = "yuangang@me.com"},
]
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "python-docx>=0.8.11",
    "lxml>=4.9",
    "rich>=13.3.5",
    "PyYAML>=6.0",
    "click>=8.1.3",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=24.0",
    "mypy>=1.10",
    "lxml-stubs",
    "types-PyYAML",
    "types-psutil",
]

[project.scripts]
doc-processor = "src.cli.main:cli"

[tool.setuptools]
package-dir = {"" = "."}
py-modules = ["doc_processor"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["tests*"]

[tool.black]
line-length = 88
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--cov=src --cov-report=term-missing"
log_cli = false
markers = [
    "unit: 单元测试",
    "integration: 集成测试",
    "smoke: 冒烟测试",
    "slow: 运行较慢的测试",
]
